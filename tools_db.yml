- name: TerraInk
  url: https://terraink.app
  source: https://github.com/yousifamanuel/terraink
  thumbnail: assets/thumbnails/terraink.svg
  category: Design & Creative
  description: >
    A free, open-source cartographic poster engine that turns any location
    in the world into a beautifully styled map poster — entirely in your browser.
    Powered by real OpenStreetMap data, with rich theme customization, layer controls,
    custom typography, and high-resolution PNG/PDF export.

- name: Regex101
  url: https://regex101.com
  source: null
  thumbnail: assets/thumbnails/regex101.png
  category: Developer Tools
  description: >
    The gold standard online regex tester and debugger. Supports PCRE,
    Python, JavaScript, Go, Java, C#/.NET, and Rust. Features live syntax highlighting,
    automatic step-by-step explanation, a cheat sheet, community pattern library,
    debugger, unit test runner, and a code generator.

- name: Monkeytype
  url: https://monkeytype.com
  source: https://github.com/monkeytypegame/monkeytype
  thumbnail: assets/thumbnails/monkeytype.png
  category: Productivity & Practice
  description: >
    A minimalistic, highly customizable typing speed test. Features multiple
    test modes (timed, word count, quotes, custom), real-time WPM and accuracy tracking,
    themes, smooth caret animations, and an account system to track your progress
    over time.

- name: Dungeon Scrawl
  url: https://www.dungeonscrawl.com
  source: null
  thumbnail: assets/thumbnails/dungeonscrawl.png
  category: Games & Tabletop
  description: >
    A free, browser-based dungeon and battlemap maker for tabletop RPGs
    like D&D and Pathfinder. Build rooms, halls, and scenes in minutes — no downloads
    or sign-up required. Supports multiple map styles, custom assets, PNG/SVG/PDF
    export, and direct Roll20 integration.

- name: MuseScore
  url: https://musescore.org/en
  source: https://github.com/musescore/MuseScore
  thumbnail: assets/thumbnails/musescore.svg
  category: Music & Audio
  description: >
    A free, open-source WYSIWYG music notation editor for composing, arranging,
    and printing sheet music. Supports a wide range of formats including MusicXML,
    MIDI, and PDF export, with integrated audio playback for real-time score preview.

- name: Auto Catalog Archive
  url: https://autocatalogarchive.com
  source: null
  thumbnail: assets/thumbnails/autocatalogarchive.png
  category: Reference & Research
  description: >
    A massive digital archive of vintage automobile brochures and catalogs
    from manufacturers around the world. Explore high-quality scans of classic car
    marketing materials spanning decades, perfect for research, design inspiration,
    or nostalgic deep dives into automotive history.

- name: SaaS is Dead
  url: https://saasisdead.si
  source: https://github.com/tonyzedginidze/saasisdead
  thumbnail: assets/thumbnails/saasisdead.png
  category: Reference & Research
  description: >
    A searchable directory of open-source alternatives to the paid software you
    subscribe to. Commercial products are organized by category, from developer
    tools to design and email marketing, each paired with its list price and
    open-source replacements with live GitHub stats. New projects can be
    suggested or submitted via GitHub.

- name: Bruno
  url: https://www.usebruno.com
  source: https://github.com/usebruno/bruno
  thumbnail: assets/thumbnails/bruno.png
  category: Developer Tools
  description: >
    An open-source, offline-first API client and Git-friendly alternative to
    Postman. Supports REST, GraphQL, gRPC, and WebSocket requests, and stores
    collections as plain-text files on your filesystem so they can be versioned
    and reviewed alongside your code. Includes environments, pre/post-request
    scripting, assertions and tests, and a CLI for running collections in CI. No
    cloud sync or account required.

- name: MonitorControl
  url: https://github.com/MonitorControl/MonitorControl
  source: https://github.com/MonitorControl/MonitorControl
  thumbnail: assets/thumbnails/monitorcontrol.png
  category: Productivity & Practice
  description: >
    A free, open-source macOS menu bar app that controls the brightness,
    contrast, and volume of external displays as if they were native Apple
    displays. Works with Apple keyboard brightness and media keys or custom
    shortcuts and shows the native macOS on-screen indicators. Combines DDC
    hardware control with software dimming, and can sync brightness across all
    your screens.

- name: Excalidraw
  url: https://excalidraw.com
  source: https://github.com/excalidraw/excalidraw
  thumbnail: assets/thumbnails/excalidraw.png
  category: Design & Creative
  description: >
    A free, open-source virtual whiteboard for sketching diagrams, wireframes,
    and flowcharts with a distinctive hand-drawn look. Runs entirely in the
    browser with no sign-up, offers end-to-end encrypted live collaboration,
    reusable shape libraries, and export to PNG, SVG, or the clipboard. Also
    available as an embeddable React component.

- name: Movie Scene Map
  url: https://moviescenemap.com
  source: null
  thumbnail: assets/thumbnails/moviescenemap.png
  category: Reference & Research
  description: >
    A free interactive world map of real filming locations for movies and TV
    series, plus the real-world settings of video games, anime, and manga.
    Search a title to see where it was shot, or a place to see what was filmed
    there, with photos and Wikipedia links for each location. Sourced from
    Wikidata and film archives, with the full dataset downloadable as CC0
    GeoJSON or CSV.

- name: FigCraft
  url: https://getartcraft.com/apps/figcraft
  source: https://github.com/storytold/figcraft
  thumbnail: assets/thumbnails/figcraft.webp
  category: Design & Creative
  description: >
    A free, open-source interface design and prototyping app built in pure Rust,
    part of the ArtCraft suite. Offers frames with auto layout, components and
    variants, vector networks, variables with light/dark modes, and interactive
    prototypes, plus a Dev Mode that generates CSS, HTML, React, SwiftUI, and
    Compose code. Runs natively offline on macOS, Windows, and Linux or in the
    browser, with real-time collaboration and no account required.

- name: tweakcn
  url: https://tweakcn.com
  source: https://github.com/jnsahaj/tweakcn
  thumbnail: assets/thumbnails/tweakcn.png
  category: Developer Tools
  description: >
    A free, open-source visual theme editor for shadcn/ui and Tailwind CSS.
    Start from a gallery of theme presets or build your own by tweaking colors,
    typography, and other style properties, with a live preview of real
    components as you go. Copy the generated theme code straight into your
    project, so your shadcn/ui app doesn't look like every other one.

- name: The Component Gallery
  url: https://component.gallery
  source: https://github.com/inbn/component-gallery
  thumbnail: assets/thumbnails/thecomponentgallery.png
  category: Reference & Research
  description: >
    A reference of user interface components collected from real-world design
    systems. Each component, from accordions to tooltips, gets a description,
    its common alternative names, and links to how dozens of design systems
    implement it. Design systems are tagged by tech stack and by features like
    code examples, accessibility guidance, and open-source availability, making
    it easy to compare approaches before building your own.

- name: Bundlephobia
  url: https://bundlephobia.com
  source: https://github.com/pastelsky/bundlephobia
  thumbnail: assets/thumbnails/bundlephobia.svg
  category: Developer Tools
  description: >
    A free, open-source tool for finding the cost of adding an npm package to
    your frontend bundle. Look up any package to see its minified and gzipped
    size, estimated download time on slow networks, and which dependencies make
    up its weight. Compare sizes across versions, check exports for tree-
    shaking, scan a whole package.json, and discover lighter alternatives.
